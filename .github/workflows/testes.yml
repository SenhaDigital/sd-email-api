name: Testes

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npx tsc --noEmit -p .

      - run: npm test
