service: sd-email-api

plugins:
  - serverless-offline
  - serverless-plugin-typescript
  - serverless-domain-manager

custom:
  customDomain:
    domainName: ${self:provider.environment.DOMAIN_NAME}
    basePath: ''
    stage: ${self:provider.stage}
    createRoute53Record: true
  mongoCollection: ${self:provider.environment.EMAIL_COLLECTION}
  mongoDatabaseName: ${self:provider.environment.DATABASE_NAME}
  emailQueueName: ${self:provider.environment.EMAIL_QUEUE_NAME}
  sendEmailQueueName: ${self:provider.environment.SEND_EMAIL_QUEUE_NAME}

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: ${self:provider.environment.REGION}
  profile: ${env:AWS_PROFILE, self:provider.environment.PROFILE}
  environment: ${file(env.${self:provider.stage}.yml)}
  timeout: 30
  iamRoleStatements:
    - Effect: Allow
      Action:
        - ses:SendEmail
        - ses:SendRawEmail
      Resource: "*"
    - Effect: Allow
      Action:
        - sqs:SendMessage
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - sqs:GetQueueAttributes
      Resource:
        - !GetAtt EmailQueue.Arn
        - !GetAtt SendEmailQueue.Arn

package:
  patterns:
    - docs/openapi.yml

functions:
  api:
    handler: src/funcoes/api.handler
    events:
      - http:
          path: /api/email/send
          method: post
          cors: true
      - http:
          path: /api/email/swagger
          method: get
          cors: true
      - http:
          path: /api/email/swagger.yaml
          method: get
          cors: true
      - http:
          path: /sdsend/email/send
          method: post
          cors: true

      - http:
          path: /api/email/validate-email
          method: post
          cors: true
      - http:
          path: /sdsend/email/validate-email
          method: post
          cors: true

      - http:
          path: /api/email/status/{jobId}
          method: get
          cors: true
      - http:
          path: /sdsend/email/status/{jobId}
          method: get
          cors: true

  processEmail:
    handler: src/funcoes/filaValidacao.handler
    events:
      - sqs:
          arn: !GetAtt EmailQueue.Arn
          batchSize: 1

  sendEmail:
    handler: src/funcoes/filaEnvio.handler
    events:
      - sqs:
          arn: !GetAtt SendEmailQueue.Arn
          batchSize: 1

resources:
  Resources:

    EmailQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.environment.EMAIL_QUEUE_NAME}
        VisibilityTimeout: 60
        MessageRetentionPeriod: 1209600

    SendEmailQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.environment.SEND_EMAIL_QUEUE_NAME}
        VisibilityTimeout: 180
        MessageRetentionPeriod: 1209600
