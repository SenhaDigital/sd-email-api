# Configurações de Ambiente - Exemplo
# Copie este arquivo para env.dev.yml ou env.prod.yml e preencha os valores

# Configurações Gerais
ENVIRONMENT: "dev"  # dev, staging, prod
STAGE: "dev"        # dev, staging, prod
REGION: "us-east-1" # Região da AWS
ACCOUNT_ID: ""      # ID da conta AWS
PROFILE: ""         # Perfil AWS CLI
SNAPSTART: false    # Habilita SnapStart para melhor desempenho

# Configurações de Banco de Dados
DATABASE_URL: "mongodb+srv://user:password@cluster.mongodb.net/database?retryWrites=true&w=majority"
DATABASE_NAME: "database_name"
EMAIL_COLLECTION: "emails"

# Configurações de Email
DEFAULT_FROM_EMAIL: "contato@empresa.com"
DEFAULT_FROM_NAME: "Sua Empresa"

# Configurações SMTP
SMTP_HOST: "smtp.seu-provedor.com"
SMTP_PORT: 587
SMTP_USER: "seu-email@empresa.com"
SMTP_PASS: "sua-senha"
SMTP_SECURE: true  # true para porta 465, false para outras
SMTP_REJECT_UNAUTHORIZED: true

# Configurações de Fila
EMAIL_QUEUE_NAME: "sd-email-queue-${self:provider.stage}"
SEND_EMAIL_QUEUE_NAME: "sd-send-email-queue-${self:provider.stage}"

# Chave de API
API_SDSEND_KEY: "sua-chave-secreta-aqui"

# Configurações de Log
LOG_LEVEL: "info"  # error, warn, info, debug, trace

# Configurações da API
API_BASE_URL: "https://api.seudominio.com"
CORS_ORIGIN: "*"  # Ou lista de origens permitidas separadas por vírgula

# Configurações de Limite de Taxa
RATE_LIMIT_WINDOW_MS: 900000  # 15 minutos em milissegundos
RATE_LIMIT_MAX_REQUESTS: 100  # Número máximo de requisições por janela

# Configurações de Cache
CACHE_TTL: 3600  # Tempo de vida do cache em segundos

# Configurações de Monitoramento
ENABLE_METRICS: true
METRICS_PORT: 9090

# Configurações de Segurança
ENABLE_RATE_LIMITING: true
ENABLE_CORS: true
ENABLE_LOGGING: true

# Configurações de Ambiente de Desenvolvimento
IS_OFFLINE: false
IS_LOCAL: false

# Configurações de Teste
NODE_ENV: "development"  # development, test, production

# Configurações de Depuração
DEBUG: "sd-email-api:*"  # Habilita logs de depuração

# Configurações de Sessão
SESSION_SECRET: "seu-segredo-de-sessao"
SESSION_TTL: 86400  # 24 horas em segundos

# Configurações de Email de Teste
TEST_EMAIL: "teste@exemplo.com"
TEST_EMAIL_NAME: "Usuário de Teste"

# Configurações de Domínio
DOMAIN_NAME: "api.seudominio.com"

# Configurações de SSL/TLS
SSL_CERT_PATH: "/caminho/para/cert.pem"
SSL_KEY_PATH: "/caminho/para/key.pem"

# Configurações de Proxy
HTTP_PROXY: ""  # Ex: "http://proxy:porta"
HTTPS_PROXY: "" # Ex: "https://proxy:porta"
NO_PROXY: ""    # Ex: "localhost,127.0.0.1"

# Configurações de Timeout
REQUEST_TIMEOUT: 30000  # 30 segundos
CONNECTION_TIMEOUT: 5000  # 5 segundos

# Configurações de Pool de Conexões
MAX_SOCKETS: 50
MAX_FREE_SOCKETS: 10
TIMEOUT: 60000  # 1 minuto

# Configurações de Cache HTTP
CACHE_CONTROL_MAX_AGE: 86400  # 1 dia em segundos

# Configurações de Compressão
COMPRESSION_LEVEL: 6  # Nível de compressão (1-9)
COMPRESSION_THRESHOLD: 1024  # Tamanho mínimo para compressão em bytes
